# ООП, лабораторная работа № 10: настройка протоколирования Log4j 2.
# Сообщения выводятся в консоль и в файл logs/issues.log.
# Формат: время, уровень, поток, класс:метод:строка - сообщение.
status = warn
name = IssuesConfig

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p [%t] %C{1}:%M:%L - %m%n
appender.console.layout.charset = UTF-8

appender.file.type = File
appender.file.name = File
appender.file.fileName = logs/issues.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{HH:mm:ss,SSS} %-5p [%t] %C{1}:%M:%L - %m%n
appender.file.layout.charset = UTF-8

rootLogger.level = debug
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

# Шум библиотек не нужен
logger.tomcat.name = org.apache
logger.tomcat.level = warn
logger.jasper.name = net.sf.jasperreports
logger.jasper.level = warn
logger.fonts.name = org.apache.fontbox
logger.fonts.level = error
